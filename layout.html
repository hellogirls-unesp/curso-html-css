<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando divs</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="topo">
        <h1>Refeições</h1>
    </div>

    <div class="menu">
        <p>Entradas</p> <p>Pratos Principais</p> <p>Sobremesas</p>
    </div>

    <div class="cards1">
        <div class="subtitulo">
            <h2>Entradas</h2>
        </div>
            <div class="itens">
                <ul>
                    <li>Sopa</li>
                    <li>Pipoca</li>
                    <li>Batata frita</li>
                </ul>
            </div>
        <div class="botao"><button>Acesse o cardápio</button></div>
    </div>

    <div class="cards2">
        <div class="subtitulo">
            <h2>Pratos principais</h2>
        </div>

            <div class="itens">
                <ul>
                   <li>Macarrão</li>
                   <li>Feijoada</li>
                   <li>Pastel</li>
                </ul>
            </div>
        <div class="botao"><button>Acesse o cardápio</button></div>
    </div>

    <div class="cards3">
        <div class="subtitulo">
            <h2>Sobremesas</h2>
        </div>
            <div class="itens">
                <ul>
                    <li>Pudim</li>
                    <li>Brigadeiro</li>
                    <li>Bolo</li>
                </ul>
            </div>
        <div class="botao"><button>Acesse o cardápio</button></div>
    </div>

    <audio controls>
        <source src="midias/audio.mp3" type="audio/mpeg">
        <source src="midias/audio.ogg" type="audio/ogg">
        <source src="midias/audio.wav" type="audio/wav">
        Seu navegador não suporta áudios.
    </audio>
 
    <video width="400px" controls poster="midias/foto.jpg">
        <source src="midias/video.mp4" type="video/mp4">
        <source src="midias/video.webm" type="video/webm">
        <source src="midias/video.ogv" type="video/ogg">
        Seu navegador não suporta vídeos.
    </video>

    <iframe width="400" height="315" src="https://www.youtube.com/embed/FEvfE51gmCU?si=MVTmQng40BB9UC1E" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

</body>
</html>
